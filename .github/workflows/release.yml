name: Release

# Run it by hand: Actions tab, choose "Release", tap "Run workflow", and type the version.
# It builds the app and publishes the APK as a GitHub Release (marked as a test release).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, for example 0.1.0
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # A debug-type build: it is signed automatically, so it can be installed on a phone.
      - name: Build the APK
        env:
          VERSION: ${{ inputs.version }}
        run: gradle assembleDebug -PversionName="$VERSION" --stacktrace

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "LilyAi-$VERSION.apk"
          gh release create "v$VERSION" "LilyAi-$VERSION.apk" \
            --title "LilyAi $VERSION (test)" \
            --notes "Test build. After installing, turn on the LilyAi accessibility service in Android settings." \
            --prerelease \
            --target "$GITHUB_SHA"
