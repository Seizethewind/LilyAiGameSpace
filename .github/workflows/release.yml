name: Release

# Two ways to use it:
# 1. Publish a release on GitHub (Releases, Draft a new release, pick a tag, Publish).
#    The app is built from that tag and the APK is attached to your release.
# 2. Run it by hand: Actions tab, choose "Release", tap "Run workflow", and type the version.
#    It creates the release itself.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version number, for example 0.1.0
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The tag is v0.1.0 or 0.1.0. The app's version name is the tag without a leading v.
      - name: Work out the version
        run: |
          if [ "$EVENT" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="v$INPUT_VERSION"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # A debug-type build: it is signed automatically, so it can be installed on a phone.
      - name: Build the APK
        run: gradle assembleDebug -PversionName="$VERSION" --stacktrace

      - name: Publish the APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "LilyAi-$VERSION.apk"
          if [ "$EVENT" = "release" ]; then
            gh release upload "$TAG" "LilyAi-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "LilyAi-$VERSION.apk" \
              --title "LilyAi $VERSION (test)" \
              --notes "Test build. After installing, turn on the LilyAi accessibility service in Android settings." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
